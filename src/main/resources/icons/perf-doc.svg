<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Material 2 Dark Theme Subtle Radial Gradient -->
    <radialGradient id="docBgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#252525"/>
      <stop offset="100%" stop-color="#181818"/>
    </radialGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#222222"/>
    </linearGradient>
  </defs>

  <!-- Document Sheet Base (Material Dark Surface) with folded corner -->
  <!-- Top-left (36, 16), Top-right fold start (172, 16), fold tip (220, 64), bottom-right (220, 240), bottom-left (36, 240) -->
  <path d="M 48 16 L 168 16 L 220 68 L 220 228 A 12 12 0 0 1 208 240 L 48 240 A 12 12 0 0 1 36 228 L 36 28 A 12 12 0 0 1 48 16 Z"
        fill="url(#docBgGrad)" stroke="#2C2C2C" stroke-width="4" stroke-linejoin="round"/>

  <!-- Subtle Inner Ring on page -->
  <path d="M 50 20 L 166 20 L 216 70 L 216 226 A 10 10 0 0 1 206 236 L 46 236 A 10 10 0 0 1 36 226 L 36 30 A 10 10 0 0 1 46 20 Z"
        fill="none" stroke="#00C853" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Folded Corner Flap -->
  <path d="M 168 16 L 168 56 A 12 12 0 0 0 180 68 L 220 68 Z"
        fill="url(#foldGrad)" stroke="#2C2C2C" stroke-width="3" stroke-linejoin="round"/>

  <!-- Exact Circuit-Board Emblem in Center (matching perfcraft.svg / circuit-board Lucide) -->
  <g transform="translate(64, 76) scale(5.33)" stroke="#00C853" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect width="18" height="18" x="3" y="3" rx="2" />
    <path d="M11 9h4a2 2 0 0 0 2-2V3" />
    <circle cx="9" cy="9" r="2" />
    <path d="M7 21v-4a2 2 0 0 1 2-2h4" />
    <circle cx="15" cy="15" r="2" />
  </g>

  <!-- Small PERF Badge at Bottom -->
  <rect x="78" y="194" width="100" height="26" rx="4" fill="#00C853"/>
  <text x="128" y="212" fill="#121212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="1.5" text-anchor="middle">.PERF</text>
</svg>
