<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PerfCraft - Perfboard Designer</title>
    <link rel="icon" type="image/svg+xml" href="/perfcraft.svg" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #121212;
        color: #E0E0E0;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 1. TOP HEADER BAR */
      header {
        height: 48px;
        background: #1E1E1E;
        border-bottom: 1px solid #2C2C2C;
        display: flex;
        align-items: center;
        padding: 0 14px;
        gap: 10px;
        z-index: 10;
        flex-shrink: 0;
      }
      .logo-box {
        display: flex;
        align-items: center;
        gap: 8px;
        color: white;
        font-weight: bold;
        font-size: 16px;
      }
      .logo-box img {
        width: 28px;
        height: 28px;
      }
      .v-sep {
        width: 1px;
        height: 22px;
        background: #2C2C2C;
        margin: 0 4px;
      }
      .hdr-btn {
        background: #242424;
        color: #B0BEC5;
        border: 1px solid #2C2C2C;
        border-radius: 4px;
        padding: 6px 12px;
        font-size: 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 500;
        transition: background 0.15s;
      }
      .hdr-btn:hover {
        background: #333333;
        color: #FFF;
      }
      .hdr-btn.save-btn {
        color: #00C853;
        font-weight: bold;
      }
      .layer-group {
        display: flex;
        background: #121212;
        border: 1px solid #2C2C2C;
        border-radius: 4px;
        padding: 2px;
        gap: 2px;
      }
      .layer-btn {
        background: transparent;
        border: none;
        border-radius: 3px;
        color: #B0BEC5;
        font-size: 11px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .layer-btn.active {
        background: #00C853;
        color: #121212;
        font-weight: bold;
      }
      .spacer {
        flex: 1;
      }
      .zoom-btn {
        background: #242424;
        color: #B0BEC5;
        border: 1px solid #2C2C2C;
        border-radius: 4px;
        width: 28px;
        height: 28px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .zoom-btn:hover {
        background: #333;
        color: #FFF;
      }

      /* WORKBENCH BODY */
      .workbench {
        flex: 1;
        display: flex;
        position: relative;
        overflow: hidden;
      }

      /* 2. LEFT TOOLBAR (68px wide) */
      .left-toolbar {
        width: 68px;
        background: #1A1A1A;
        border-right: 1px solid #2C2C2C;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 6px;
        gap: 10px;
        z-index: 5;
        flex-shrink: 0;
      }
      .big-tool-btn {
        width: 54px;
        height: 52px;
        background: #242424;
        color: #B0BEC5;
        border: 1px solid #2C2C2C;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 9px;
        gap: 2px;
        transition: all 0.15s;
      }
      .big-tool-btn .icon {
        font-size: 16px;
      }
      .big-tool-btn:hover {
        background: #303030;
      }
      .big-tool-btn.active {
        background: #00C853;
        color: #121212;
        font-weight: bold;
        border-color: #00C853;
      }
      .h-sep {
        width: 44px;
        height: 1px;
        background: #2C2C2C;
        margin: 4px 0;
      }
      .small-tool-btn {
        width: 38px;
        height: 32px;
        background: #242424;
        color: #B0BEC5;
        border: 1px solid #2C2C2C;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
      }
      .small-tool-btn:hover {
        background: #333;
      }
      .small-tool-btn.del-btn {
        color: #E53935;
        font-size: 12px;
      }

      /* 3. CENTER CANVAS */
      .canvas-container {
        flex: 1;
        position: relative;
        background: #0E0E0E;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* 4. RIGHT SIDEBAR (270px wide) */
      .right-sidebar {
        width: 270px;
        background: #1A1A1A;
        border-left: 1px solid #2C2C2C;
        display: flex;
        flex-direction: column;
        padding: 14px;
        gap: 12px;
        z-index: 5;
        flex-shrink: 0;
        overflow-y: auto;
      }
      .section-heading {
        color: #9E9E9E;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 0.5px;
      }
      .comp-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .comp-grid-btn {
        background: #242424;
        color: #ECEFF1;
        border: 1px solid #2C2C2C;
        border-radius: 4px;
        padding: 8px 6px;
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .comp-grid-btn .icon {
        font-size: 13px;
        color: #00C853;
      }
      .comp-grid-btn:hover {
        background: #303030;
      }
      .comp-grid-btn.selected {
        background: #1B3524;
        border-color: #00C853;
        color: #00E676;
      }

      /* Wire Mode Box */
      .wire-mode-box {
        padding-top: 8px;
        border-top: 1px solid #2C2C2C;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .wire-btn-row {
        display: flex;
        gap: 6px;
      }
      .wire-mode-btn {
        flex: 1;
        background: #242424;
        color: #B0BEC5;
        border: 1px solid #2C2C2C;
        border-radius: 4px;
        padding: 6px;
        font-size: 11px;
        cursor: pointer;
      }
      .wire-mode-btn.active {
        background: #00C853;
        color: #121212;
        font-weight: bold;
        border-color: #00C853;
      }
      .cable-colors {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-top: 2px;
      }
      .color-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid #555;
        cursor: pointer;
      }
      .color-dot.active {
        border: 2px solid #FFF;
        transform: scale(1.15);
      }

      /* Properties */
      .prop-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .prop-label {
        color: #9E9E9E;
        font-size: 11px;
      }
      .prop-input {
        background: #242424;
        border: 1px solid #2C2C2C;
        border-radius: 4px;
        color: #FFF;
        padding: 6px 8px;
        font-size: 12px;
        outline: none;
      }
      .prop-input:focus {
        border-color: #00C853;
      }

      /* Resistor color bands box */
      .resistor-preview-box {
        background: #121212;
        border: 1px solid #2C2C2C;
        border-radius: 4px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .resistor-strip {
        background: #D7CCC8;
        border: 1px solid #A1887F;
        border-radius: 3px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      .resistor-band {
        width: 6px;
        height: 18px;
      }
      .resistor-ohm-label {
        color: #B0BEC5;
        font-size: 10px;
        font-family: monospace;
        text-align: center;
      }

      /* 5. BOTTOM STATUSBAR */
      footer {
        height: 26px;
        background: #181818;
        border-top: 1px solid #2C2C2C;
        display: flex;
        align-items: center;
        padding: 0 14px;
        gap: 16px;
        font-size: 11px;
        color: #9E9E9E;
        font-family: monospace;
        flex-shrink: 0;
      }
      .status-layer-val {
        color: #00C853;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <!-- 1. Header Bar -->
    <header>
      <div class="logo-box">
        <img src="/perfcraft.png" alt="PerfCraft Logo" />
        <span>PerfCraft</span>
      </div>
      <div class="v-sep"></div>
      <button class="hdr-btn" id="btnNew">New</button>
      <button class="hdr-btn" id="btnOpen">Open</button>
      <input type="file" id="fileInput" accept=".perf,application/json" style="display: none;" />
      <button class="hdr-btn save-btn" id="btnSave">Save</button>
      <button class="hdr-btn" id="btnExport">Export</button>

      <div class="v-sep"></div>

      <!-- Layer Toggle Box -->
      <div class="layer-group">
        <button class="layer-btn active" id="btnLayerTop">Top (F)</button>
        <button class="layer-btn" id="btnLayerBottom">Bottom (B)</button>
        <button class="layer-btn" id="btnLayerBoth">Both</button>
      </div>

      <div class="spacer"></div>

      <!-- Zoom Buttons -->
      <button class="zoom-btn" id="btnZoomOut">-</button>
      <button class="zoom-btn" id="btnZoomIn">+</button>
      <button class="hdr-btn" id="btnSettings">⚙ Settings</button>
    </header>

    <!-- 2. Workbench -->
    <div class="workbench">
      <!-- Left Toolbar (3 Tools + Rotate + Delete) -->
      <div class="left-toolbar">
        <button class="big-tool-btn active" id="toolSelect">
          <span class="icon">↖</span>
          <span>Select</span>
        </button>
        <button class="big-tool-btn" id="toolWire">
          <span class="icon">〰</span>
          <span>Wire</span>
        </button>
        <button class="big-tool-btn" id="toolComp">
          <span class="icon">⌖</span>
          <span>Comp</span>
        </button>

        <div class="h-sep"></div>

        <button class="small-tool-btn" id="actionRotate" title="Rotate 90° (R)">↻</button>
        <button class="small-tool-btn del-btn" id="actionDelete" title="Delete (Del)">✕</button>
      </div>

      <!-- Center Canvas -->
      <div class="canvas-container">
        <canvas id="perfCanvas"></canvas>
      </div>

      <!-- Right Sidebar (Components + Wire Mode + Properties + Resistor Bands) -->
      <div class="right-sidebar">
        <div class="section-heading">COMPONENTS</div>
        <div class="comp-grid">
          <button class="comp-grid-btn" data-type="TACTILE_SWITCH">
            <span class="icon">⊡</span>
            <span>Switch</span>
          </button>
          <button class="comp-grid-btn selected" data-type="RESISTOR_AXIAL">
            <span class="icon">〰</span>
            <span>Resistor</span>
          </button>
          <button class="comp-grid-btn" data-type="CAPACITOR_CERAMIC">
            <span class="icon">||</span>
            <span>Capacitor</span>
          </button>
          <button class="comp-grid-btn" data-type="LED">
            <span class="icon">▷|↗</span>
            <span>LED</span>
          </button>
          <button class="comp-grid-btn" data-type="DIODE">
            <span class="icon">▷|</span>
            <span>Diode</span>
          </button>
          <button class="comp-grid-btn" data-type="IC_DIP">
            <span class="icon">⚏</span>
            <span>IC DIP</span>
          </button>
        </div>

        <!-- Wire Mode Selection -->
        <div class="wire-mode-box">
          <div style="color: #B0BEC5; font-size: 11px; font-weight: bold;">Wire Mode:</div>
          <div class="wire-btn-row">
            <button class="wire-mode-btn active" id="btnWireCable">Cable</button>
            <button class="wire-mode-btn" id="btnWireSilver">Silver Wire</button>
          </div>
          <div class="cable-colors" id="cableColorsBox">
            <div class="color-dot active" style="background: #E53935;" data-color="#E53935"></div>
            <div class="color-dot" style="background: #212121;" data-color="#212121"></div>
            <div class="color-dot" style="background: #1E88E5;" data-color="#1E88E5"></div>
            <div class="color-dot" style="background: #FDD835;" data-color="#FDD835"></div>
            <div class="color-dot" style="background: #43A047;" data-color="#43A047"></div>
          </div>
        </div>

        <div class="h-sep" style="width: 100%;"></div>

        <!-- Component Properties -->
        <div class="section-heading">PROPERTIES</div>
        <div class="prop-row">
          <div class="prop-label">Designator</div>
          <input type="text" class="prop-input" id="propDesignator" value="SW1" />
        </div>
        <div class="prop-row">
          <div class="prop-label">Value / Model</div>
          <input type="text" class="prop-input" id="propValue" value="10k" />
        </div>

        <!-- Resistor Color Bands Box -->
        <div class="resistor-preview-box" id="resistorPreviewBox">
          <div style="color: #9E9E9E; font-size: 10px;">IEC 60062 Color Bands</div>
          <div class="resistor-strip" id="resistorColorStrip"></div>
          <div class="resistor-ohm-label" id="resistorOhmLabel">10 kΩ ±5%</div>
        </div>
      </div>
    </div>

    <!-- 3. Bottom Status Bar -->
    <footer>
      <span id="statHoleLabel">Hole: X: 1, Y: 1</span>
      <span id="statMmLabel">Pos: 0.00 mm x 0.00 mm</span>
      <div class="spacer"></div>
      <span>Layer: <span class="status-layer-val" id="statLayerVal">Top (F)</span></span>
      <span style="color: #424242;">|</span>
      <span>Grid: 2.54 mm (100 mil)</span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
