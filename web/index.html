<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PerfCraft Web - Perfboard & Stripboard CAD</title>
    <link rel="icon" type="image/svg+xml" href="/perfcraft.svg" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #121212;
        color: #E0E0E0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* Header */
      header {
        height: 48px;
        background: #1E1E1E;
        border-bottom: 1px solid #2C2C2C;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
        z-index: 10;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: bold;
        font-size: 16px;
        color: #FFF;
      }
      .logo img {
        width: 24px;
        height: 24px;
      }
      .btn {
        background: #2E2E2E;
        color: #EEE;
        border: 1px solid #3A3A3A;
        border-radius: 4px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        touch-action: manipulation;
      }
      .btn:hover {
        background: #383838;
      }
      .btn.primary {
        background: #00C853;
        color: #121212;
        border-color: #00C853;
        font-weight: bold;
      }
      .divider {
        width: 1px;
        height: 20px;
        background: #3A3A3A;
        margin: 0 4px;
      }

      /* Main container */
      .workbench {
        flex: 1;
        display: flex;
        position: relative;
        overflow: hidden;
      }

      /* Left Sidebar / Tools */
      .sidebar-left {
        width: 200px;
        background: #1E1E1E;
        border-right: 1px solid #2C2C2C;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 12px;
        z-index: 5;
      }
      .section-title {
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        color: #00C853;
        margin-top: 4px;
      }
      .tool-btn {
        background: #2A2A2A;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 8px 10px;
        color: #DDD;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .tool-btn.active {
        background: #00C853;
        color: #121212;
        font-weight: bold;
        border-color: #00C853;
      }
      .comp-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .comp-chip {
        background: #242424;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .comp-chip.selected {
        border-color: #00C853;
        background: #1C3325;
      }

      /* Center Canvas */
      .canvas-container {
        flex: 1;
        position: relative;
        background: #0E0E0E;
        touch-action: none; /* Crucial for multi-touch gestures */
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Right Sidebar / Inspector */
      .sidebar-right {
        width: 240px;
        background: #1E1E1E;
        border-left: 1px solid #2C2C2C;
        display: flex;
        flex-direction: column;
        padding: 14px;
        gap: 12px;
        z-index: 5;
      }
      .field-label {
        font-size: 11px;
        color: #888;
        margin-bottom: 4px;
      }
      input[type="text"] {
        background: #181818;
        border: 1px solid #333;
        border-radius: 4px;
        color: #FFF;
        padding: 8px 10px;
        font-size: 13px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: #00C853;
      }
      .bands-box {
        background: #252525;
        border: 1px solid #383838;
        border-radius: 4px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Floating Action Bar for Touch */
      .floating-touch-bar {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(30, 30, 30, 0.92);
        backdrop-filter: blur(8px);
        border: 1px solid #3A3A3A;
        border-radius: 28px;
        padding: 6px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        z-index: 20;
      }
      .touch-action-btn {
        background: transparent;
        border: none;
        color: #FFF;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        padding: 6px 12px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .touch-action-btn:active {
        background: rgba(255, 255, 255, 0.15);
      }

      /* Responsive rules for Tablet & Mobile */
      @media (max-width: 900px) {
        .sidebar-left, .sidebar-right {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="logo">
        <img src="/perfcraft.svg" alt="PerfCraft Logo" />
        PerfCraft Web
      </div>
      <div class="divider"></div>
      <button class="btn" id="btnNew">Neu</button>
      <button class="btn" id="btnOpen">Öffnen (.perf)</button>
      <input type="file" id="fileInput" accept=".perf,application/json" style="display: none;" />
      <button class="btn" id="btnSave">Speichern</button>
      <div class="divider"></div>
      <button class="btn" id="btnLayerTop">Oben</button>
      <button class="btn" id="btnLayerBottom">Unten</button>
      <button class="btn" id="btnLayerBoth">Beide</button>
    </header>

    <!-- Workbench -->
    <div class="workbench">
      <!-- Left Toolbar -->
      <div class="sidebar-left">
        <div class="section-title">WERKZEUGE</div>
        <button class="tool-btn active" id="toolSelect">
          <span>Auswahl</span>
          <kbd>V</kbd>
        </button>
        <button class="tool-btn" id="toolWire">
          <span>Draht / Jumper</span>
          <kbd>W</kbd>
        </button>
        <button class="tool-btn" id="toolComp">
          <span>Bauteil</span>
          <kbd>C</kbd>
        </button>

        <div class="section-title">BAUTEILE</div>
        <div class="comp-list">
          <div class="comp-chip selected" data-type="RESISTOR_AXIAL">Widerstand (Axial)</div>
          <div class="comp-chip" data-type="TACTILE_SWITCH">Taster (6x6 mm)</div>
          <div class="comp-chip" data-type="LED">LED</div>
          <div class="comp-chip" data-type="CAPACITOR_CERAMIC">Kondensator</div>
          <div class="comp-chip" data-type="DIODE">Diode</div>
          <div class="comp-chip" data-type="IC_DIP">IC (DIP)</div>
        </div>
      </div>

      <!-- Center Canvas Container -->
      <div class="canvas-container">
        <canvas id="perfCanvas"></canvas>

        <!-- Floating Touch Action Bar -->
        <div class="floating-touch-bar">
          <button class="touch-action-btn" id="actionRotate">🔄 Drehen (R)</button>
          <div style="width: 1px; height: 16px; background: #444;"></div>
          <button class="touch-action-btn" id="actionDelete" style="color: #FF5252;">🗑 Löschen</button>
        </div>
      </div>

      <!-- Right Sidebar (Inspector) -->
      <div class="sidebar-right">
        <div class="section-title">EIGENSCHAFTEN</div>
        <div>
          <div class="field-label">Bezeichnung</div>
          <input type="text" id="propDesignator" placeholder="z. B. R1" />
        </div>
        <div>
          <div class="field-label">Wert / Modell</div>
          <input type="text" id="propValue" placeholder="z. B. 10k" />
        </div>
        <div>
          <div class="field-label">IEC-Farbringe</div>
          <div class="bands-box" id="bandsPreview"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
